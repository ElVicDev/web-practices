<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example 4 - Formularios</title>
</head>
<body>
  <p>Cambie el contenido del campo de texto y luego salga del campo
      para activar el evento de cambio.
      No presione Enter o se enviará el formulario.</p>
    <form id="target">
      <input type="text" name="one" value="Hello there" 
         style="vertical-align: middle;"/> 
      <img id="spinner" src="spinner.gif" height="25" 
          style="vertical-align: middle; display:none;">
    </form>
    <hr/>
    <div id="result"></div>
    <hr/>
    <script type="text/javascript" src="jquery.min.js"></script>
    <script type="text/javascript">
      $('#target').change(function(event) {
        $('#spinner').show();
        var form = $('#target');
        var txt = form.find('input[name="one"]').val();
        window.console && console.log('Sending POST');
        $.post( 'autoecho.php', { 'val': txt },
          function( data ) {
              window.console && console.log(data);
              $('#result').empty().append(data);
              $('#spinner').hide();
          }
        ).error( function() { 
          $('#target').css('background-color', 'red');
          alert("Dang!");
      });
      });
    </script>
</body>
</html>
