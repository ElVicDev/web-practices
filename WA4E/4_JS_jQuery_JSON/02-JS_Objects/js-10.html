<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>JavaScript - Objects</title>
</head>
<body>
   <p>JavaScript Objects</p>
   <p>js-10.htm</p>
   <script type="text/javascript">
      balls = {"golf": "Golf balls",
         "tennis": "Tennis balls", 
         "ping": "Ping Pong balls"};

      balls.kick = function () {
         console.log('Boom!');
      }

      for (ball in balls) {
         val = balls[ball];
         console.log(ball+' = '+typeof val);
      }
   </script>
</body>
</html>
