<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descripción General JavaScript</title>
</head>
<body>
    <p>Definite Loops (for)</p>
    <script type="text/javascript">
    balls = {"golf": "Golf balls",
        "tennis": "Tennis balls", 
        "ping": "Ping Pong balls"};
    
    for (ball in balls) {
       console.log(ball+' = '+balls[ball]);
    }
    </script>
</body>
</html>
