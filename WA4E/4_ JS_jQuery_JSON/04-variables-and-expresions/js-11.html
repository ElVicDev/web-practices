<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Making a Variable Local</title>
</head>
<body>
    <script type="text/javascript">
        gl = 123;
        function check() {
            var gl = 456;
        }
        check();
        window.console && console.log("GL = "+gl);
    </script>
</body>
</html>
