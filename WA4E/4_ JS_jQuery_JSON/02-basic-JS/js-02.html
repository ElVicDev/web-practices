<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript - Objects</title>
</head>
<body>
    <p>JavaScript Objects</p>
    <script type="text/javascript">
        function PartyAnimal() {
            this.x = 0;
            this.party = function () {
                this.x = this.x + 1;
                console.log("So far "+this.x);
            }
        }
        an = new PartyAnimal();
        an.party();
        an.party();
        an.party();
    </script>
</body>
</html>
