<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Características principales del lenguaje</title>
</head>
<body>
    <p>One Paragraph</p>
    <!-- En JS podemos utilizar las comillas simples o las comillas dobles.
        También el caracter de barra invertida como escape y que funciona
        como una nueva línea. -->
    <script type="text/javascript">
        alert('One line\nTwo line');
    </script>
    <p>Two Paragraph</p>
</body>
</html>
