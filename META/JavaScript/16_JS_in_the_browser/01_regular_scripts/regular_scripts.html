<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regular Script</title>
</head>
<body>
    Regular, "old school" JS script.
    <script type="text/javascript">
        console.log('Hola desde la etiqueta script');
    </script>
    <script>
        console.log('El texto/javascript es el valor predeterminado.');
        console.log('Así que ni siquiera tenemos que usarlo con la etiqueta de script.');
        console.log('Está implícito');
    </script>
</body>
</html>
