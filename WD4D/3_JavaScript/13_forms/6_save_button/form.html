<!-- Ejemplo de un formulario con boton de Save -->

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Form with Save Button</title>
	<link rel="stylesheet" href="css/form.css">
	<script src = "js/form.js"></script>
</head>
<body>	
	<form action = "https://codepen.io/ColleenEMc/pen/0d5553e00754f2f5668dc58141b2f1da">
		<label>Your Name:		<input type="text" id="name" name="name" placeholder = "Your Name" required></label>
		<label>Preferred email address:<input type="email" id="email_addr" name="email1" value = "me@me.com" required></label>
		<label>Repeat email address:
		<input type="email" id="email_repeat" name="email2" required></label>
		<input type = 'submit' value = "Next" onclick = "return check();">
		<input type = 'submit' value = "Save" onclick = "return false;">
	</form>  
</body>
</html>
