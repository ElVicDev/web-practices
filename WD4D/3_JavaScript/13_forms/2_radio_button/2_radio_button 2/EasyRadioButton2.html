<!-- Ejemplo de Easy Radio Button número 2 -->

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Easy Radio Button 2</title>
	<!-- <link rel="stylesheet" href="css/checkbox2.css"> -->
	<!-- <script src = "js/checkbox2.js"></script> -->
</head>
<body>
  <form>
    Gender<br/>
    <label><input type="radio" name="gender" value = "male"> Male</label><br/>
    <label><input type="radio" name="gender" value="female">Female</label><br/><br/>
    Favorite Food<br/>
    <label><input type="radio" name="food"  value = "pizza"> Pizza</label><br/>
    <label><input type="radio" name="food" value="Chips" checked="true">Chips</label><br/>
    <label><input type="radio" name="food" value="Kale">Kale</label><br/>
    <input type = "submit">
  </form>
</body>
</html>
