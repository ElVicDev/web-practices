<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>JavaScript Functions</title>
</head>
<body>
  <script>
    function message(msg){
      document.getElementById('output').innerHTML = msg;
    }
  </script>
  <h1>Functions</h1>
  <p id='output'>Stuff</p>
  <script>
    message("My message is 'Hi!'");
  </script>
</body>
</html>
