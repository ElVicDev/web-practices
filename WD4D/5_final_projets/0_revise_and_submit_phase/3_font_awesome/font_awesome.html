<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="description" content="Font Awesome">
	<meta name="author" content="Vicente Escobar Colín">
	<title>Using Font Awesome</title>
	<script src="https://kit.fontawesome.com/654bd2b762.js" crossorigin="anonymous"></script>
	<link rel="stylesheet" href="css/fa-style.css">
</head>
<body>
	Some Font Awesome examples:<br/>
	<i class="fa fa-bus"></i><br/>
	<i class="fa fa-calendar"></i></br/>
	<i class="fa fa-calculator fa-3x"></i><br/>
	<i class="fa fa-bullseye"></i><br/>
	<i class="fa fa-refresh fa-spin fa-3x fa-fw"></i><span class="sr-only">Loading...</span><br>
	<i class="fa fa-spinner fa-pulse fa-3x fa-fw"></i><span class="sr-only">Loading...</span><br>
	<i class="fa fa-cog fa-spin fa-3x fa-fw" aria-hidden="true"></i> <span class="sr-only">Saving. Hang tight!</span><br>
</body>
</html>
